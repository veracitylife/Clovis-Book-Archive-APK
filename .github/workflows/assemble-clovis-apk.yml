name: Assemble Clovis APK Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/assemble-clovis-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified APK handoff
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --connect-timeout 10 --max-time 60 \
            'https://clovisstar.com/codex-release/clovis-star-library-1.1.0.apk' \
            -o clovis-star-library-1.1.0.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          expected_sha='7F5FE78D6414758D3E7E1A51C4B9963424877A8E52F3BA5125D8A7607627E24B'
          actual_sha="$(sha256sum clovis-star-library-1.1.0.apk | awk '{print toupper($1)}')"
          test "$actual_sha" = "$expected_sha"
          actual_size="$(wc -c < clovis-star-library-1.1.0.apk | tr -d ' ')"
          test "$actual_size" = '94365'

      - name: Write release metadata
        run: |
          set -euo pipefail
          cat > README.md <<'EOF'
          # Clovis Book Archive APK

          This repository contains the ready-to-install Android APK for the Clovis Star Library / Book Archive app.

          ## APK

          - File: `clovis-star-library-1.1.0.apk`
          - Package: `com.clovisstar.library`
          - Version: `1.1.0`
          - Version code: `5`
          - Min SDK: `23`
          - Target SDK: `36`
          - Size: `94,365` bytes
          - SHA-256: `7F5FE78D6414758D3E7E1A51C4B9963424877A8E52F3BA5125D8A7607627E24B`

          ## App Details

          The app provides a modern mobile interface for searching and reading the Clovis Star library archive. It uses the live archive feed at:

          `https://clovisstar.com/api/library.php`

          The app also includes mobile menu links for:

          - Royal Game of Ur: `https://royalgameofur.clovisstar.com/`
          - Senterej: `https://senterej.clovisstar.com/`

          ## Repository Scope

          This repository intentionally includes only the compiled APK, this README, and `.gitignore`. It does not include development source files, build folders, signing keys, database credentials, or other internal project files.

          ## License

          All rights reserved. No source or binary redistribution rights are granted except by the repository owner.
          EOF
          sed -i 's/^          //' README.md
          cat > .gitignore <<'EOF'
          *
          !README.md
          !clovis-star-library-1.1.0.apk
          !.gitignore
          EOF
          sed -i 's/^          //' .gitignore

      - name: Commit clean release repository
        run: |
          set -euo pipefail
          rm -rf .github
          git config user.name 'Codex Release Bot'
          git config user.email 'codex@clovisstar.com'
          git add -A
          git commit -m 'Upload Clovis Star Library APK 1.1.0'
          git push
